server:
  port: 8084
spring:
  application:
    name: blend-validation-service
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5438}/validation_db
    username: validation_user
    password: ${DB_PASSWORD:validation_pw}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: blend-validation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.soa.common.event.BlendCreatedEvent
        spring.json.trusted.packages: com.soa.common.event
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  security:
    enabled: false        # flip to true at Checkpoint 1 (after auth-service works)
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum!!}
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
