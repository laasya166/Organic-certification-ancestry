server:
  port: 8083
spring:
  application:
    name: certificate-service
  datasource:
    url: jdbc:postgresql://localhost:5432/certificate_db
    username: certificate_user
    password: ${DB_PASSWORD:certificate_pw}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  security:
    enabled: false        # flip to true at Checkpoint 1 (after auth-service works)
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum!!}
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
