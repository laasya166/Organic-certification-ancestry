server:
  port: 8082
spring:
  application:
    name: lot-ancestry-service
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5438}/ancestry_db
    username: ancestry_user
    password: ${DB_PASSWORD:ancestry_pw}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  security:
    enabled: false        # flip to true at Checkpoint 1 (after auth-service works)
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum!!}
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
